third_party_settings:
  search_api_solr:
    finalize: false
    commit_before_finalize: false
    commit_after_finalize: false
    debug_finalize: false
    highlighter:
      maxAnalyzedChars: 51200
      fragmenter: gap
      usePhraseHighlighter: true
      highlightMultiTerm: true
      preserveMulti: false
      regex:
        slop: 0.5
        pattern: blank
        maxAnalyzedChars: 10000
      highlight:
        mergeContiguous: false
        requireFieldMatch: false
        snippets: 3
        fragsize: 0
    mlt:
      mintf: 1
      mindf: 1
      maxdf: 0
      maxdfpct: 0
      minwl: 0
      maxwl: 0
      maxqt: 100
      maxntp: 2000
      boost: false
      interestingTerms: none
    term_modifiers:
      slop: 3
      fuzzy: 1
      fuzzy_analyzer: true
    advanced:
      index_prefix: ''
      collection: ''
      timezone: ''
    multilingual:
      limit_to_content_language: false
      include_language_independent: true
      use_language_undefined_as_fallback_language: false
      specific_languages:
        fi: '0'
        en: '0'
      use_universal_collation: false
id: contacts_search
name: 'Contacts Search'
description: 'Index for Person and Place of Business search'
read_only: false
field_settings:
  field_alternative_name:
    label: 'Alternative name'
    datasource_id: 'entity:node'
    property_path: field_alternative_name
    type: text
    dependencies:
      config:
        - field.storage.node.field_alternative_name
  field_first_names:
    label: 'First name'
    datasource_id: 'entity:node'
    property_path: field_first_names
    type: text
    dependencies:
      config:
        - field.storage.node.field_first_names
  field_hide_email_in_search:
    label: 'Hide email in search'
    datasource_id: 'entity:node'
    property_path: field_hide_email_in_search
    type: boolean
    dependencies:
      config:
        - field.storage.node.field_hide_email_in_search
  field_last_name:
    label: 'Last name'
    datasource_id: 'entity:node'
    property_path: field_last_name
    type: text
    dependencies:
      config:
        - field.storage.node.field_last_name
  name:
    label: 'HR Title'
    datasource_id: 'entity:node'
    property_path: 'field_hr_title:entity:name'
    type: text
    dependencies:
      config:
        - field.storage.node.field_hr_title
