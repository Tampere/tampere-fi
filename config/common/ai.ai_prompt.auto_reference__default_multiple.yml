id: auto_reference__default_multiple
label: 'Default prompt for multiple target references'
type: auto_reference
prompt: |
  For the contents within the code block: 
  ```{contents}```

  Which two to four of the following `|` separated options are highly relevant and moderately relevant?
  ```{possible_results}```

  Return selections from within the square brackets only and as a valid RFC8259 compliant JSON array within two array keys `highly` and `moderately` without deviation.
  Example:
  {
      "highly": [
          "First suggestion",
          "Second suggestion"
      ],
      "moderately": [
          "Third suggestion",
          "Fourth suggestion"
      ]
  }
