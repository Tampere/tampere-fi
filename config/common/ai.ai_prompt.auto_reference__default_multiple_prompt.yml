id: auto_reference__default_multiple_prompt
label: 'Default prompt for multiple target references'
type: auto_reference
prompt: 'For the contents within the code block: \r\n```{contents}```\r\n\r\n{RECENT_EXAMPLES}\r\n\r\nWhich two to four of the following `|` separated options are highly relevant and moderately relevant?\r\n```{possible_results}```\r\n\r\nEhdota myös aihealuetta \"kansalaisvaikuttaminen\" ja asiasanan \"osallistu ja vaikuta\" aina näissä tilanteissa:\r\n- Kun sisältö käsittelee asukkaiden tai kaupungin muiden sidosryhmien mahdollisuutta kertoa mielipiteensä tai kokemuksensa kaupungin toimintaan liittyvästä aiheesta tai kaupungin valmistelussa olevasta asiasta, tai mahdollisuudesta antaa jostakin asiasta palautetta.\r\n- Kun sisältö käsittelee asukkaiden tai kaupungin muiden sidosryhmien antamaa palautetta kaupungin toimintaan liittyvästä aiheesta tai kaupungin valmistelussa olevasta asiasta tai palautteen vaikutuksia kaupungin toimintaan.\r\n- Kun sisältö infoaa tulevasta kaupunginvaltuuston kokouksesta\r\n\r\nEhdota myös aihealuetta \"organisaatio\" ja asiasanan \"kaupunki ja päätöksenteko\" aina näissä tilanteissa:\r\n- Kun sisältö käsittelee henkilöstömuutoksia Tampereen kaupungin organisaatiossa.\r\n- Kun sisältö käsittelee Tampereen kaupungin luottamushenkilöitä.\r\n- Kun sisältö käsittelee Tampereen kaupungin taloutta.\r\n- Kun sisältö käsittelee Tampereen kaupungin strategiaa.\r\n- Kun sisältö käsittelee Tampereen kaupungin myöntämää palkintoa tai tunnustusta.\r\n- Kun sisältö käsittelee Tampereen kaupungille myönnettyä palkintoa tai tunnustusta tai Tampereen kaupungin ehdokkuutta palkintoon tai tunnustukseen.\r\n- Kun sisältö käsittelee Tampereen kaupungin kannanottoa kaupunkina johonkin aiheeseen.\r\n- Kun sisältö käsittelee Tampereen kaupungin myöntämiä avustuksia.\r\n- Kun sisältö käsittelee Tampereen kaupungin hakemia tai järjestämiä suurtapahtumia.\r\n- Kun sisältö käsittelee Tampereen kaupungin tukea tapahtumajärjestäjille.\r\n- Kun sisältö käsittelee Tampereen kaupunginvaltuuston tai lautakuntien vuosisuunnitelmia.\r\n- Kun sisältö käsittelee Tampereen kaupungin toimintaa yhteistyökumppanina valtakunnallisissa tai kansainvälisissä hankkeissa ja tapahtumissa.\r\n\r\nEhdota myös aihealuetta \"hyvinvointi\" ja asiasanan \"hyvinvointi, yhteisöt ja harrastukset\" aina näissä tilanteissa:\r\n- Kun sisältö käsittelee terveyden ja hyvinvoinnin tukemista.\r\n- Kun sisältö käsittelee Tampereen asukkaiden arkea tukevia palveluja.\r\n- Kun sisältö käsittelee yhteisöllistä toimintaa esimerkiksi yhteisökeskuksia ja kohtaamispaikkoja.\r\n- Kun sisältö käsittelee turvallisuutta.\r\n- Kun sisältö käsittelee yhdenvertaisuutta ja tasa-arvoa.\r\n- Kun sisältö käsittelee kaupungin tukea ja palveluja yhdistyksille, järjestöille ja muille kolmannen sektorin yhteisöille tai näiden tuottamaa toimintaa.\r\n\r\nEhdota myös aihealueita \"kaupunkisuunnittelu\" ja \"maankäyttö, kaavoitus ja tontit\" sekä asiasanoja \"kaupunkisuunnittelu\", \"kaavoitus\" ja \"kaupunkiympäristö uudistuu\" aina näissä tilanteissa:\r\n- Kun sisältö käsittelee suunnitteilla tai valmisteilla olevia tai eteneviä tai hyväksyttyjä Tampereen yleiskaavoja ja asemakaavoja sekä niiden muutoksia.\r\n\r\nEhdota myös aihealuetta \"kaupunkisuunnittelu\" sekä asiasanoja \"kaupunkisuunnittelu\" ja \"kaupunkiympäristö uudistuu\" aina näissä tilanteissa:\r\n- Kun sisältö käsittelee Tampereen uusien puistojen tai muiden viheralueiden sekä leikkipaikkojen suunnitelmia tai valmistuneita uusia puistoja, viheralueita tai leikkipaikkoja, tai olemassa olevien puistojen tai muiden viheralueiden sekä leikkipaikkojen uudistuksia tai muita muutoksia.\r\n- Kun sisältö käsittelee Tampereen liikenteeseen suunnitteilla olevia, valmistelussa olevia tai jo valmistuneita muutoksia, esimerkiksi uusia yhteyksiä ja katuja tai muita yleisiä alueita.\r\n\r\nEhdota myös aihealueita \"rakentaminen\" ja \"kiinteistöt\" sekä asiasanan \"asuminen ja rakentaminen\" aina näissä tilanteissa:\r\n- Kun sisältö käsittelee Tampereen kaupungin kiinteistöjen rakentamista tai korjaamista.\r\n- Kun sisältö käsittelee Tampereen asukkaiden tai muiden Tampereella rakentavien tai remontoivien tahojen kiinteistöjen, esimerkiksi omakotitalojen tai kerrostalojen sekä niiden lisärakennusten, rakentamista tai korjaamista.\r\n\r\nReturn selections from within the square brackets only and as a valid RFC8259 compliant JSON array within two array keys `highly` and `moderately` without deviation.\r\nExample:\r\n{\r\n    \"highly\": [\r\n        \"First suggestion\",\r\n        \"Second suggestion\"\r\n    ],\r\n    \"moderately\": [\r\n        \"Third suggestion\",\r\n        \"Fourth suggestion\"\r\n    ]\r\n}'
